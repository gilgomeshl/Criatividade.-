<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curriculum Vitae</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f4;
        }
        header {
            text-align: center;
            margin-bottom: 20px;
        }
        section {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        h1, h2 {
            color: #333;
        }
        .contact {
            margin-top: 20px;
        }
        .btn {
            display: inline-block;
            padding: 10px 20px;
            font-size: 16px;
            color: white;
            background-color: #007bff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
        }
        .btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <header>
        <h1>Curriculum Vitae</h1>
        <h2>Gilmar Gomes</h2>
        <p>Age: 19</p>
        <p>Student of Computer Engineering</p>
    </header>
    <section>
        <h2>Programming Languages</h2>
        <ul>
            <li>C</li>
            <li>C#</li>
            <li>JavaScript</li>
            <li>HTML5</li>
            <li>CSS3</li>
        </ul>
    </section>
    <section>
        <h2>Projects</h2>
        <ul>
            <li>Project 1</li>
            <li>Project 2</li>
            <li>Project 3</li>
        </ul>
    </section>
    <section>
        <h2>Timeline</h2>
        <p>Details about timeline...</p>
    </section>
    <section class="contact">
        <h2>Contact</h2>
        <a href="#" class="btn" onclick="downloadPDF()">Download PDF Curriculum</a>
    </section>
    <script>
        function downloadPDF() {
            const pdfContent = `\
            \# Curriculum Vitae\
            Name: Gilmar Gomes\
            Age: 19\
            Student of Computer Engineering\
            Programming Languages: C, C#, JavaScript, HTML5, CSS3\
            Projects: Project 1, Project 2, Project 3\
            Contact Links: [Your Contact Links]`;

            const blob = new Blob([pdfContent], { type: 'application/pdf' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'Curriculum_Vitae_Gilmar_Gomes.pdf';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
